<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday, Appi</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family: 'Montserrat', sans-serif;

    background:
    linear-gradient(
        180deg,
        #28243e 0%,
        #5d526f 45%,
        #d99a9d 100%
    );
}

/* ---------------- BACKGROUND ---------------- */

.sky {
    position: fixed;
    inset: 0;
    z-index: -5;
}

/* ---------------- FIREFLIES ---------------- */

.firefly {
    position: absolute;

    width: 5px;
    height: 5px;

    background: #ffe5a3;

    border-radius: 50%;

    box-shadow:
    0 0 8px #ffd76a,
    0 0 18px #ffcb52;

    animation: glow 3s infinite ease-in-out;
}

@keyframes glow {

    0%,100% {
        opacity: .2;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }

}

/* ---------------- LANTERNS ---------------- */

.lantern {

    position: absolute;

    width: 55px;
    height: 70px;

    border-radius:
    50% 50% 40% 40%;

    background:

    radial-gradient(
        circle at center,
        #fff4a6,
        #ffbb58,
        #d87542
    );

    box-shadow:

    0 0 20px #ffb85c,
    0 0 50px rgba(255,160,70,.7);

    animation:
    float 7s infinite ease-in-out;

}

.lantern::before {

    content: "";

    position: absolute;

    top: -8px;

    left: 15px;

    width: 25px;

    height: 8px;

    border-top:

    2px solid #7b4534;

}

.lantern::after {

    content: "";

    position: absolute;

    bottom: -8px;

    left: 12px;

    width: 30px;

    height: 8px;

    border-radius: 50%;

    border-bottom:

    4px solid #8a4933;

}

@keyframes float {

    0%,100% {

        transform:
        translateY(0)
        rotate(-2deg);

    }

    50% {

        transform:
        translateY(-35px)
        rotate(2deg);

    }

}


/* ---------------- PETALS ---------------- */

.petal {

    position: absolute;

    width: 10px;
    height: 16px;

    background:
    rgba(255,190,200,.8);

    border-radius:
    70% 30% 70% 30%;

    animation:
    fall 12s linear infinite;

}

@keyframes fall {

    from {

        transform:
        translateY(-50px)
        rotate(0deg);

        opacity: 1;

    }

    to {

        transform:
        translateY(110vh)
        translateX(120px)
        rotate(500deg);

        opacity: 0;

    }

}


/* ---------------- FIREWORKS ---------------- */

.firework {

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    animation:
    explode 4s infinite;

}

.firework::before {

    content: "";

    position: absolute;

    width: 4px;
    height: 80px;

    background:

    linear-gradient(
        transparent,
        #ffd978,
        transparent
    );

    transform-origin:
    bottom center;

    box-shadow:

    0 0 8px #ffd978,
    0 0 20px #ffb84d;

}

@keyframes explode {

    0% {

        transform:
        scale(.1);

        opacity: 0;

    }

    30% {

        opacity: 1;

    }

    60% {

        transform:
        scale(1.5);

    }

    100% {

        transform:
        scale(2);

        opacity: 0;

    }

}


/* ---------------- CARD ---------------- */

.card {

    width: 90%;

    max-width: 580px;

    padding:
    65px 45px;

    text-align: center;

    background:
    rgba(35,25,45,.28);

    backdrop-filter:
    blur(14px);

    border:

    1px solid
    rgba(255,220,160,.55);

    box-shadow:

    0 20px 70px
    rgba(0,0,0,.35),

    inset
    0 0 50px
    rgba(255,210,130,.06);

    animation:
    appear 2s ease;

}


h1 {

    font-family:
    'Cormorant Garamond',
    serif;

    font-size:
    68px;

    font-weight:
    500;

    color:
    #fff0d4;

    text-shadow:

    0 0 10px
    #ffd88b,

    0 0 30px
    rgba(255,185,100,.6);

}


.divider {

    width:
    90px;

    height:
    1px;

    margin:
    30px auto;

    background:

    linear-gradient(
        to right,
        transparent,
        #ffd37c,
        transparent
    );

}


h2 {

    font-family:
    'Cormorant Garamond',
    serif;

    font-size:
    32px;

    font-weight:
    400;

    color:
    #f7d9a7;

    margin-bottom:
    35px;

}


.message {

    color:
    #fff7ed;

    font-size:
    16px;

    font-weight:
    300;

    line-height:
    2;

    max-width:
    430px;

    margin:
    auto;

    text-shadow:

    0 2px 10px
    rgba(0,0,0,.5);

}


@keyframes appear {

    from {

        opacity: 0;

        transform:
        translateY(30px);

    }

    to {

        opacity: 1;

        transform:
        translateY(0);

    }

}


/* ---------------- MOBILE ---------------- */

@media(max-width:600px) {

    h1 {

        font-size:
        52px;

    }

    h2 {

        font-size:
        28px;

    }

    .card {

        padding:
        50px 25px;

    }

}

</style>

</head>


<body>


<!-- ===================== -->
<!-- BACKGROUND ELEMENTS -->
<!-- ===================== -->


<div class="sky">


<!-- LANTERNS -->

<div class="lantern"
style="left:8%; top:25%;">
</div>

<div class="lantern"
style="right:8%; top:38%; animation-delay:2s;">
</div>

<div class="lantern"
style="left:18%; bottom:10%; animation-delay:4s;">
</div>


<!-- FIREFLIES -->

<div class="firefly"
style="left:20%; top:50%;">
</div>

<div class="firefly"
style="left:35%; top:70%; animation-delay:1s;">
</div>

<div class="firefly"
style="right:25%; top:55%; animation-delay:2s;">
</div>

<div class="firefly"
style="right:40%; top:75%; animation-delay:3s;">
</div>

<div class="firefly"
style="left:50%; top:30%; animation-delay:2s;">
</div>


<!-- PETALS -->

<div class="petal"
style="left:10%; animation-delay:1s;">
</div>

<div class="petal"
style="left:25%; animation-delay:5s;">
</div>

<div class="petal"
style="left:60%; animation-delay:3s;">
</div>

<div class="petal"
style="left:80%; animation-delay:7s;">
</div>


<!-- FIREWORKS -->

<div class="firework"
style="left:20%; top:12%;">
</div>

<div class="firework"
style="left:50%; top:8%; animation-delay:1.5s;">
</div>

<div class="firework"
style="right:18%; top:15%; animation-delay:3s;">
</div>


</div>


<!-- ===================== -->
<!-- BIRTHDAY CARD -->
<!-- ===================== -->


<div class="card">


<h1>
Happy Birthday
</h1>


<div class="divider"></div>


<h2>
Dear Appi
</h2>


<p class="message">

I hope that by your next birthday,
I'll be there with you, celebrating
your special day by your side and
making memories we can cherish forever.

</p>


</div>


</body>
</html>
